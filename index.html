<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101412">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Workout">
<title>筋トレメニュー</title>
<style>
:root{--bg:#111827;--card:#1f2937;--line:#374151;--tx:#f3f4f6;--sub:#9ca3af;--ac:#f59e0b;--ok:#10b981}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:84px}
header{padding:14px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--line)}
main{padding:14px 16px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--sub);font-size:14px}nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--tx);font-size:15px}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.chip small{display:block;font-size:11px;opacity:.75;font-weight:400}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#111;font-size:17px;font-weight:700}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;font-size:14px;border-radius:8px}
.ex{display:flex;justify-content:space-between;align-items:center}
.ex b{font-size:17px}.muted{color:var(--sub);font-size:13px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#111827;color:var(--tx);font-size:17px;text-align:center}
.set .chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--sub);font-size:20px}
.set.done .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.pr{color:var(--ac);font-size:12px;font-weight:700}
#timer{position:fixed;left:16px;right:16px;bottom:70px;background:var(--ac);color:#111;border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;font-weight:700;z-index:5}
.row{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.info{border:1px solid var(--line);background:none;color:var(--ac);border-radius:50%;width:26px;height:26px;font-size:15px;vertical-align:middle;padding:0}
#info{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#info .sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.wd{text-align:center;color:var(--sub);font-size:12px}
.day{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:none;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:14px;line-height:1.1}
.day small{font-size:10px;color:var(--ac)}.day.did{background:#3b2a05;border-color:var(--ac)}.day.today{outline:2px solid var(--sub)}.day.sel{background:var(--ac);color:#111}.day.sel small{color:#111}
#guide{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px calc(14px + env(safe-area-inset-bottom));gap:8px;max-width:560px;margin:auto}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.gtop b{font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{align-self:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:700;min-height:40px;text-align:center}
#gsvg{width:100%;flex:1;min-height:0;max-height:46vh;background:#0b1220;border-radius:14px}
.gcount{text-align:center;line-height:1}.gcount span{font-size:72px;font-weight:800;color:var(--ac);display:inline-block}.gcount small{font-size:22px;color:var(--sub);margin-left:6px}
.pop{animation:pop .25s ease-out}@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.gw{text-align:center;color:var(--sub);display:flex;gap:10px;justify-content:center;align-items:center}.gw b{color:var(--tx);min-width:64px;display:inline-block}
.gbtns{display:flex;gap:10px}.gbtns .btn{flex:1}
select{padding:8px;border-radius:8px;background:#111827;color:var(--tx);border:1px solid var(--line);font-size:15px}
</style></head><body>
<header style="display:flex;justify-content:space-between;align-items:center"><span id="ttl">🏋️ 筋トレメニュー</span><button id="lang" class="chip" style="padding:4px 12px;font-size:13px">EN</button></header>
<main id="app"></main>
<div id="timer"><span id="tt">休憩 0:00</span><button class="btn sm sec" id="tclose" onclick="stopTimer()">閉じる</button></div>
<nav><button data-t="menu" class="on">メニュー</button><button data-t="train">記録</button><button data-t="cal">カレンダー</button><button data-t="hist">履歴</button></nav>
<script src="anim.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body></html>
